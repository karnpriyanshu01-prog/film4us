name: film4us
description: Film4us - a minimal, cinematic, modern movie streaming frontend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking (future backend communication abstraction)
  dio: ^5.4.3+1

  # Image loading & caching
  cached_network_image: ^3.3.1

  # Video playback
  video_player: ^2.9.1

  # Local file handling for downloads
  path_provider: ^2.1.3

  # Runtime permissions for downloads/storage
  permission_handler: ^11.3.1

  # Opening external contact/community links from Settings
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
